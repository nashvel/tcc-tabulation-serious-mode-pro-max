<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Offline - Podium Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Header */
    .header {
      height: 48px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }
    
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-icon {
      width: 24px;
      height: 24px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo-icon svg {
      width: 14px;
      height: 14px;
      color: #1f2937;
    }
    
    .logo-text {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      letter-spacing: -0.025em;
    }
    
    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    
    /* Offline Icon */
    .offline-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    
    .offline-icon svg {
      width: 40px;
      height: 40px;
      color: #9ca3af;
    }
    
    /* Message */
    .title {
      font-size: 20px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 8px;
      text-align: center;
    }
    
    .subtitle {
      font-size: 14px;
      color: #6b7280;
      text-align: center;
      max-width: 300px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    
    /* Retry Button */
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: #111827;
      color: white;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .retry-btn:hover {
      background: #1f2937;
    }
    
    .retry-btn svg {
      width: 16px;
      height: 16px;
    }
    
    /* Background Text */
    .background-text {
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      user-select: none;
    }
    
    .brand-text {
      font-family: 'Playfair Display', serif;
      font-size: 72px;
      font-weight: 600;
      color: #111827;
      letter-spacing: -1px;
    }
    
    .brand-text .letter {
      display: inline-block;
    }
    
    .brand-text .letter-r {
      font-size: 80px;
    }
    
    /* Responsive */
    @media (max-width: 640px) {
      .brand-text {
        font-size: 48px;
      }
      .brand-text .letter-r {
        font-size: 56px;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo-container">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </div>
      <span class="logo-text">Podium Ledger</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Offline Icon -->
    <div class="offline-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22"></line>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"></path>
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"></path>
        <path d="M5 13a10 10 0 0 1 5.24-2.76"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <!-- Message -->
    <h1 class="title">You're Offline</h1>
    <p class="subtitle">
      It looks like you've lost your internet connection. Please check your network and try again.
    </p>

    <!-- Retry Button -->
    <button class="retry-btn" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"></path>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
        <path d="M3 22v-6h6"></path>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
      </svg>
      Try Again
    </button>

    <!-- Background Text -->
    <div class="background-text">
      <span class="brand-text">
        PodiumLed<span class="letter">g</span><span class="letter">e</span><span class="letter letter-r">r</span>
      </span>
    </div>
  </main>

  <script>
    // Auto-retry when back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
